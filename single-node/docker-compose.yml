services:
  wazuh.dashboard:
    depends_on:
      wazuh.indexer:
        condition: service_started
        required: true
      wazuh.manager:
        condition: service_started
        restart: true
        required: true
    environment:
      API_PASSWORD: ${WAZUH_API_PASS}
      API_USERNAME: ${WAZUH_API_USER}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASS}
      DASHBOARD_USERNAME: ${DASHBOARD_USER}
      INDEXER_PASSWORD: ${INDEXER_PASS}
      INDEXER_USERNAME: ${INDEXER_USER}
      WAZUH_API_URL: https://wazuh.manager
    hostname: wazuh.dashboard
    image: wazuh/wazuh-dashboard:4.14.5
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager
    networks:
      default: null
    # No ports published — Caddy proxies to this internally on port 5601
    restart: always
    volumes:
      - type: bind
        source: /usr/local/ISGservices/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem
        target: /usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
        bind:
          create_host_path: true
      - type: bind
        source: /usr/local/ISGservices/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem
        target: /usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
        bind:
          create_host_path: true
      - type: bind
        source: /usr/local/ISGservices/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/root-ca.pem
        target: /usr/share/wazuh-dashboard/certs/root-ca.pem
        bind:
          create_host_path: true
      - type: bind
        source: /usr/local/ISGservices/wazuh-docker/single-node/config/wazuh_dashboard/opensearch_dashboards.yml
        target: /usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
        bind:
          create_host_path: true
      - type: bind
        source: /usr/local/ISGservices/wazuh-docker/single-node/config/wazuh_dashboard/wazuh.yml
        target: /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
        bind:
          create_host_path: true
      - type: volume
        source: wazuh-dashboard-config
        target: /usr/share/wazuh-dashboard/data/wazuh/config
        volume: {}
      - type: volume
        source: wazuh-dashboard-custom
        target: /usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
        volume: {}

  wazuh.indexer:
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    hostname: wazuh.indexer
    image: wazuh/wazuh-indexer:4.14.5
    networks:
      default: null
    ports:
      - mode: ingress
        target: 9200
        published: "9200"
        protocol: tcp
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - type: volume
        source: wazuh-indexer-data
        target: /var/lib/wazuh-indexer
        volume: {}
      - type: bind
        source: /usr/local/ISGservices/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/root-ca.pem
        target: /usr/share/wazuh-indexer/config/certs/root-ca.pem
        bind:
          create_host_path: true
      - type: bind
        source: /usr/local/ISGservices/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem
        target: /usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
        bind:
          create_host_path: true
      - type: bind
        source: /usr/local/ISGservices/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem
        target: /usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
        bind:
          create_host_path: true
      - type: bind
        source: /usr/local/ISGservices/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/admin.pem
        target: /usr/share/wazuh-indexer/config/certs/admin.pem
        bind:
          create_host_path: true
      - type: bind
        source: /usr/local/ISGservices/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/admin-key.pem
        target: /usr/share/wazuh-indexer/config/certs/admin-key.pem
        bind:
          create_host_path: true
      - type: bind
        source: /usr/local/ISGservices/wazuh-docker/single-node/config/wazuh_indexer/wazuh.indexer.yml
        target: /usr/share/wazuh-indexer/config/opensearch.yml
        bind:
          create_host_path: true
      - type: bind
        source: /usr/local/ISGservices/wazuh-docker/single-node/config/wazuh_indexer/internal_users.yml
        target: /usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
        bind:
          create_host_path: true

  wazuh.manager:
    build:
      context: /usr/local/ISGservices/wazuh-docker/single-node/wazuh-manager
      dockerfile: Dockerfile
    environment:
      API_PASSWORD: ${WAZUH_API_PASS}
      API_USERNAME: ${WAZUH_API_USER}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      INDEXER_PASSWORD: ${INDEXER_PASS}
      INDEXER_URL: '"https://wazuh.indexer:9200"'
      INDEXER_USERNAME: ${INDEXER_USER}
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_KEY: /etc/ssl/filebeat.key
    hostname: wazuh.manager
    networks:
      default: null
    ports:
      - mode: ingress
        target: 1514
        published: "1514"
        protocol: tcp
      - mode: ingress
        target: 1515
        published: "1515"
        protocol: tcp
      - mode: ingress
        target: 514
        published: "514"
        protocol: udp
      - mode: ingress
        target: 55000
        published: "55000"
        protocol: tcp
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    volumes:
      - type: volume
        source: wazuh_api_configuration
        target: /var/ossec/api/configuration
        volume: {}
      - type: volume
        source: wazuh_etc
        target: /var/ossec/etc
        volume: {}
      - type: volume
        source: wazuh_logs
        target: /var/ossec/logs
        volume: {}
      - type: volume
        source: wazuh_queue
        target: /var/ossec/queue
        volume: {}
      - type: volume
        source: wazuh_var_multigroups
        target: /var/ossec/var/multigroups
        volume: {}
      - type: volume
        source: wazuh_integrations
        target: /var/ossec/integrations
        volume: {}
      - type: volume
        source: wazuh_active_response
        target: /var/ossec/active-response/bin
        volume: {}
      - type: volume
        source: wazuh_agentless
        target: /var/ossec/agentless
        volume: {}
      - type: volume
        source: wazuh_wodles
        target: /var/ossec/wodles
        volume: {}
      - type: volume
        source: filebeat_etc
        target: /etc/filebeat
        volume: {}
      - type: volume
        source: filebeat_var
        target: /var/lib/filebeat
        volume: {}
      - type: bind
        source: /usr/local/ISGservices/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/root-ca-manager.pem
        target: /etc/ssl/root-ca.pem
        bind:
          create_host_path: true
      - type: bind
        source: /usr/local/ISGservices/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.manager.pem
        target: /etc/ssl/filebeat.pem
        bind:
          create_host_path: true
      - type: bind
        source: /usr/local/ISGservices/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem
        target: /etc/ssl/filebeat.key
        bind:
          create_host_path: true
      - type: bind
        source: /usr/local/ISGservices/wazuh-docker/single-node/config/wazuh_cluster/wazuh_manager.conf
        target: /wazuh-config-mount/etc/ossec.conf
        bind:
          create_host_path: true

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - mode: ingress
        target: 443
        published: "443"
        protocol: tcp
      - mode: ingress
        target: 80
        published: "80"
        protocol: tcp
    volumes:
      - type: bind
        source: /usr/local/ISGservices/wazuh-docker/single-node/config/caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        bind:
          create_host_path: true
      - type: bind
        source: /usr/local/ISGservices/certs
        target: /certs
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /usr/local/ISGservices/register
        target: /register
        read_only: true
        bind:
          create_host_path: true
      - type: volume
        source: caddy_data
        target: /data
        volume: {}
      - type: volume
        source: caddy_config
        target: /config
        volume: {}
    networks:
      default: null
    depends_on:
      wazuh.dashboard:
        condition: service_started
        required: true

networks:
  default:

volumes:
  caddy_data:
  caddy_config:
  filebeat_etc:
  filebeat_var:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  wazuh-indexer-data:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_integrations:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_wodles:
